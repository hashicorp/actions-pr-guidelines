---
name: "PR Guidelines Workflow"
author: "HashiCorp"
description: "Run PR Guidelines Workflow"

branding:
  color: red
  icon: heart

inputs:
  github-token:
    description: "GitHub token access to actions-pr-guidelines."
    required: true

runs:
  using: composite
  steps: 
    - name: 'Comment about PR review guidelines'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.html_url }}
      run: |
        gh pr comment "$PR" --body-file comment-body.md
